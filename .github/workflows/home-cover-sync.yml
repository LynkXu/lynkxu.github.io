name: Sync daily home cover

on:
  schedule:
    # Once a day at 00:15 UTC (08:15 Beijing Time, UTC+8)
    - cron: "15 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: home-cover-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Wikimedia POTD home cover
        run: node scripts/fetch-home-cover.mjs

      - name: Detect home cover changes
        id: cover_changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- src/data/home-cover.json public/home-cover/daily.webp)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes (if any)
        id: commit
        if: steps.cover_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/home-cover.json public/home-cover/daily.webp
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: sync daily home cover"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # NOTE: commits pushed via GITHUB_TOKEN do not always trigger other workflows via `push`.
      # Trigger deploy explicitly to keep behavior consistent.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/astro.yml/dispatches" \
            -d '{"ref":"main"}'
